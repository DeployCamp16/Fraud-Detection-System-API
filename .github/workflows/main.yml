name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Trigger manually via GitHub Actions UI

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  MODEL_API_URL: ${{ secrets.MODEL_API_URL }}
  IMAGE_NAME: fraud_detection_system_api
  SSH_HOST: ${{ secrets.SSH_HOST }}  # Your server IP
  SSH_USER: ${{ secrets.SSH_USER }}  # SSH username (e.g., root, ubuntu)

jobs:    
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          echo "MODEL_API_URL=$MODEL_API_URL" > .env
          cat .env  # For debugging

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Environment
        run: |
          python --version
          pip list

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
    
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            MODEL_API_URL=${{ secrets.MODEL_API_URL }}

  deploy:
    needs: build-and-push  # Wait for build to complete
    runs-on: ubuntu-latest
    
    steps:
      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull the latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            
            # Stop and remove old container if exists
            docker stop ${{ env.IMAGE_NAME }} || true
            docker rm ${{ env.IMAGE_NAME }} || true
            
            # Run new container (customize ports/volumes as needed)
            docker run -d \
              --name ${{ env.IMAGE_NAME }} \
              -p 8000:8000 \
              -e MODEL_API_URL=${{ secrets.MODEL_API_URL }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            
            # Clean up unused images
            docker image prune -af
